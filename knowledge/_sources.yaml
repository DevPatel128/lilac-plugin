# Watched sources for /lilac:research. A list of places to look, not claims. Nothing here is fetched without the user's yes.
# kind: official (vendor docs, release feeds) | secondary | inspiration (look only, never copy) | signal (hints only, never a source of a claim)
# Pages fetched from these URLs are UNVERIFIED until a record with a verbatim quote exists. Vendor changelog URLs are UNKNOWN until confirmed.
